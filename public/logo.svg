<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 104" width="440" height="104" role="img" aria-label="Postcode Atlas — Nigerian Postalcode Atlas">
  <title>Postcode Atlas — Nigerian Postalcode Atlas</title>
  <defs>
    <linearGradient id="npaGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A05A"/>
      <stop offset="100%" stop-color="#00663A"/>
    </linearGradient>
  </defs>

  <!-- Mark: pin on Nigerian green -->
  <g>
    <rect x="8" y="20" width="64" height="64" rx="16" fill="url(#npaGreen)"/>
    <path fill="#ffffff" d="M40 30.4a14.2 14.2 0 0 1 14.2 14.2c0 10.2-14.2 27-14.2 27S25.8 54.8 25.8 44.6A14.2 14.2 0 0 1 40 30.4z"/>
    <circle cx="40" cy="44.4" r="5.6" fill="#00663A"/>
  </g>

  <!-- NPA, with the five NDAPS segments beneath it -->
  <text x="92" y="56" font-size="36" font-weight="700" letter-spacing="1"
        fill="#111827" font-family="Geist, Inter, -apple-system, 'Segoe UI', sans-serif">NPA</text>
  <g fill="#0F7B4D">
    <rect x="92" y="64" width="9" height="3.4" rx="1.7"/>
    <rect x="104" y="64" width="9" height="3.4" rx="1.7"/>
    <rect x="116" y="64" width="9" height="3.4" rx="1.7"/>
    <rect x="128" y="64" width="9" height="3.4" rx="1.7"/>
    <rect x="140" y="64" width="9" height="3.4" rx="1.7"/>
  </g>

  <!-- Descriptor -->
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="92" y="85" font-size="12" font-weight="500" letter-spacing="2.4" fill="#0F7B4D">POSTCODE ATLAS</text>
    <text x="93" y="97" font-size="8.5" letter-spacing="0.5" fill="#6B7280">NATIONAL DIGITAL POSTCODE SYSTEM</text>
  </g>
</svg>