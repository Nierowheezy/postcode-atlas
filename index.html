<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ask Atlas - Nigerian Postcode Atlas</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#008751" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#008751" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NPA" />
  <meta name="description"
    content="Ask anything about Nigerian postcodes - states, LGAs, districts, landmarks and areas. Grounded in NIPOST data and powered by N-ATLAS. Free and open source." />

  <!-- Link previews (LinkedIn, X, WhatsApp, Slack, Discord, Facebook).
       These tags MUST be absolute URLs: crawlers do not resolve relative
       paths and do not run JavaScript, so this is all they ever see.
       Keep the image small: WhatsApp drops the thumbnail above ~300 KB, so
       /og.jpg is a committed 1200x630 JPEG (~70 KB). Regenerate it with
       `npm run og` in the `video/` Remotion project. -->
  <link rel="canonical" href="https://nigerian-postalcode-atlas.vercel.app/" />

  <meta property="og:site_name" content="Nigerian Postcode Atlas" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nigerian-postalcode-atlas.vercel.app/" />
  <meta property="og:locale" content="en_NG" />
  <meta property="og:title" content="Ask Atlas - Nigerian Postcode Atlas" />
  <meta property="og:description"
    content="Ask anything about Nigerian postcodes - states, LGAs, districts, landmarks and areas. Grounded in NIPOST data and powered by N-ATLAS." />
  <meta property="og:image" content="https://nigerian-postalcode-atlas.vercel.app/og.jpg" />
  <meta property="og:image:secure_url" content="https://nigerian-postalcode-atlas.vercel.app/og.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"
    content="Ask Atlas: the Nigerian Postcode Atlas map, grounded in NIPOST data and powered by N-ATLAS." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ask Atlas - Nigerian Postcode Atlas" />
  <meta name="twitter:description"
    content="Ask anything about Nigerian postcodes - states, LGAs, districts, landmarks and areas. Grounded in NIPOST data and powered by N-ATLAS." />
  <meta name="twitter:image" content="https://nigerian-postalcode-atlas.vercel.app/og.jpg" />
  <meta name="twitter:image:alt"
    content="Ask Atlas: the Nigerian Postcode Atlas map, grounded in NIPOST data and powered by N-ATLAS." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
